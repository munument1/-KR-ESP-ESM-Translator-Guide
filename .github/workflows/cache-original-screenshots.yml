name: Cache original EET tutorial screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-original-screenshots.yml"

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tutorial screenshots and rewrite README
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(r'https://www\.confrerie-des-traducteurs\.fr/forum/upload/[^)\s]+?\.(?:PNG|png|JPG|jpg|JPEG|jpeg)')
          urls = list(dict.fromkeys(pattern.findall(text)))

          out = Path("docs/images")
          out.mkdir(parents=True, exist_ok=True)
          referer = "https://www.confrerie-des-traducteurs.fr/forum/viewtopic.php?f=372&t=29457"

          replacements = {}
          for i, url in enumerate(urls, 1):
              base = Path(urlparse(url).path).name
              safe = re.sub(r'[^A-Za-z0-9._-]+', '_', base)
              target = out / f"{i:02d}_{safe}"
              print(f"[{i}/{len(urls)}] {url} -> {target}")
              cmd = [
                  "curl", "-L", "--fail", "--retry", "2",
                  "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
                  "-e", referer,
                  "-o", str(target), url
              ]
              direct = subprocess.run(cmd)
              if direct.returncode != 0:
                  from urllib.parse import quote
                  proxy = "https://images.weserv.nl/?url=" + quote(url, safe="")
                  print("Direct fetch blocked; retrying through image proxy:", proxy)
                  subprocess.run([
                      "curl", "-L", "--fail", "--retry", "3",
                      "-A", "Mozilla/5.0",
                      "-o", str(target), proxy
                  ], check=True)
              if target.stat().st_size < 100:
                  raise RuntimeError(f"Downloaded file is suspiciously small: {target}")
              replacements[url] = target.as_posix()

          for old, new in replacements.items():
              text = text.replace(old, new)

          readme.write_text(text, encoding="utf-8")
          print(f"Cached {len(replacements)} screenshots.")

      - name: Commit cached screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/images
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: cache original tutorial screenshots [skip ci]"
            git push
          fi
