name: Cache original EET tutorial screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-original-screenshots.yml"

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tutorial screenshots and rewrite README
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(r'https://www\.confrerie-des-traducteurs\.fr/forum/upload/[^)\s]+?\.(?:PNG|png|JPG|jpg|JPEG|jpeg)')
          urls = list(dict.fromkeys(pattern.findall(text)))

          out = Path("docs/images")
          out.mkdir(parents=True, exist_ok=True)
          referer = "https://www.confrerie-des-traducteurs.fr/forum/viewtopic.php?f=372&t=29457"

          # Establish a forum session first. The source forum blocks hotlinked image requests.
          subprocess.run([
              "curl", "-L", "--retry", "1",
              "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "-c", "/tmp/confrerie-cookies.txt",
              "-o", "/tmp/confrerie-tutorial.html",
              referer
          ])

          replacements = {}
          for i, url in enumerate(urls, 1):
              base = Path(urlparse(url).path).name
              safe = re.sub(r'[^A-Za-z0-9._-]+', '_', base)
              target = out / f"{i:02d}_{safe}"
              print(f"[{i}/{len(urls)}] {url} -> {target}")
              cmd = [
                  "curl", "-L", "--fail", "--retry", "2",
                  "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
                  "-e", referer,
                  "-b", "/tmp/confrerie-cookies.txt",
                  "-c", "/tmp/confrerie-cookies.txt",
                  "-H", "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
                  "-H", "Sec-Fetch-Dest: image",
                  "-H", "Sec-Fetch-Mode: no-cors",
                  "-H", "Sec-Fetch-Site: same-origin",
                  "-o", str(target), url
              ]
              direct = subprocess.run(cmd)
              ok = direct.returncode == 0 and target.exists() and target.stat().st_size >= 100
              if not ok:
                  from urllib.parse import quote
                  proxy = "https://images.weserv.nl/?url=" + quote(url, safe="")
                  print("Direct fetch blocked; retrying through image proxy:", proxy)
                  p = subprocess.run([
                      "curl", "-L", "--fail", "--retry", "2",
                      "-A", "Mozilla/5.0",
                      "-o", str(target), proxy
                  ])
                  ok = p.returncode == 0 and target.exists() and target.stat().st_size >= 100

              if not ok:
                  import json
                  from urllib.parse import quote
                  cdx = (
                      "https://web.archive.org/cdx/search/cdx?url="
                      + quote(url, safe="")
                      + "&output=json&filter=statuscode:200&fl=timestamp,original&limit=5&from=2018"
                  )
                  print("Trying Wayback Machine:", cdx)
                  raw = subprocess.check_output(["curl", "-L", "--fail", "-sS", cdx], text=True)
                  rows = json.loads(raw)
                  if len(rows) < 2:
                      raise RuntimeError(f"No archived screenshot found: {url}")
                  ts, original = rows[-1]
                  archived = f"https://web.archive.org/web/{ts}id_/{original}"
                  subprocess.run([
                      "curl", "-L", "--fail", "--retry", "3",
                      "-A", "Mozilla/5.0",
                      "-o", str(target), archived
                  ], check=True)
                  ok = target.exists() and target.stat().st_size >= 100

              if not ok:
                  raise RuntimeError(f"Could not obtain screenshot: {url}")
              replacements[url] = target.as_posix()

          for old, new in replacements.items():
              text = text.replace(old, new)

          readme.write_text(text, encoding="utf-8")
          print(f"Cached {len(replacements)} screenshots.")

      - name: Commit cached screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/images
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: cache original tutorial screenshots [skip ci]"
            git push
          fi
